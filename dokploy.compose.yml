services:
  zubu-web-dokploy:
    image: ghcr.io/hernanstupniki/agency-landing-page:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: zubu-web-dokploy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    mem_limit: 384m
    cpus: "0.35"
    pids_limit: 128
    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.zubu-web-dokploy.rule=Host(`${DOMAIN_NAME:-zubuagency.com}`) || Host(`www.${DOMAIN_NAME:-zubuagency.com}`)
      - traefik.http.routers.zubu-web-dokploy.entrypoints=web,websecure
      - traefik.http.routers.zubu-web-dokploy.tls=true
      - traefik.http.routers.zubu-web-dokploy.tls.certresolver=mytlschallenge
      - traefik.http.services.zubu-web-dokploy.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
