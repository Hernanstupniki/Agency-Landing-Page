name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hernanstupniki/agency-landing-page

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint and Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if immutable SHA tag already exists
        id: check-sha
        run: |
          if docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "==> Tag sha-${GITHUB_SHA} already exists in GHCR. Rebuilding is skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "==> Tag sha-${GITHUB_SHA} not found in GHCR. Image will be built."
          fi

      - name: Build and push immutable SHA image
        if: steps.check-sha.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote SHA image to latest
        run: |
          echo "==> Promoting immutable sha-${GITHUB_SHA} to latest..."
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Verify and log immutable digests
        run: |
          sha_inspect="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}")"
          echo "=== GHCR INSPECT sha-${GITHUB_SHA} ==="
          echo "$sha_inspect"
          latest_inspect="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:latest")"
          echo "=== GHCR INSPECT latest ==="
          echo "$latest_inspect"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Dokploy Webhook
        run: |
          echo "==> Triggering Dokploy deployment webhook..."
          curl --fail-with-body --show-error --silent \
            --connect-timeout 10 --max-time 300 --retry 3 \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -d '{"ref":"refs/heads/main"}' \
            -X POST "http://72.62.15.178:3000/api/deploy/compose/WoiUudSb4KXNXmKyKp6rp"
          echo ""
          echo "==> Dokploy deployment triggered successfully."